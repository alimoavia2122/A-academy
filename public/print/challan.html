<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fee challan | Arhum Academy</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    @page { size: A4 landscape; margin: 6mm; }
    body { background: #e4e9e6; font-family: Arial, Helvetica, sans-serif; color: #000; }
    .bar { background: #fff; padding: 10px 16px; display: flex; gap: 10px; align-items: center; position: sticky; top: 0; z-index: 5; border-bottom: 1px solid #ccc; }
    .sheet { width: 285mm; height: 196mm; margin: 10px auto; background: #fff; display: flex; page-break-after: always; break-after: page; }
    .sheet:last-child { page-break-after: auto; break-after: auto; }
    .copy { flex: 1; border: 1px dashed #444; padding: 4mm 5mm; font-size: 11px; display: flex; flex-direction: column; min-width: 0; }
    .head { text-align: center; border-bottom: 2px solid #000; padding-bottom: 3mm; }
    .logo { width: 14mm; height: 14mm; border: 1px dashed #888; margin: 0 auto 1.5mm; font-size: 7px; color: #888; display: flex; align-items: center; justify-content: center; }
    .head b { font-size: 14px; display: block; }
    .tag { text-align: center; font-weight: bold; margin: 2mm 0; padding: 1mm; border: 1px solid #000; letter-spacing: .02em; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 2.5mm; }
    td { padding: 1.2mm 1.5mm; border: 1px solid #777; vertical-align: top; }
    td.r { text-align: right; white-space: nowrap; }
    td.k { width: 36%; background: #f2f2f2; }
    tr.total td { font-weight: bold; font-size: 12px; background: #eee; }
    .note { font-size: 10px; margin-bottom: 2.5mm; }
    .sign { margin-top: auto; display: flex; justify-content: space-between; gap: 6mm; padding-top: 12mm; font-size: 10px; }
    .sign span { border-top: 1px solid #000; flex: 1; text-align: center; padding-top: 1mm; }
    @media print { body { background: #fff; } .bar { display: none; } .sheet { margin: 0; } }
  </style>
</head>
<body>
  <div class="bar"><button class="btn" id="print-btn">Print</button><span id="info" class="muted">Loading…</span>
    <span class="muted small">Tip: choose paper size A4, landscape, scale 100%.</span></div>
  <div id="out"></div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/print-challan.js"></script>
</body>
</html>
