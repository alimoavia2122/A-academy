<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports | Arhum Academy Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <div class="flex items-center gap-3"><button class="btn btn-light menu-btn" id="menu-btn" aria-label="Open menu">☰</button><h1>Reports</h1></div>
      <div class="flex gap-2 flex-wrap no-print" id="head-actions"><button class="btn btn-light" id="btn-print">Print this report</button></div>
    </div>
    <div class="tabs no-print" role="tablist">
      <button class="tab active" data-tab="defaulters" role="tab">Defaulters</button>
      <button class="tab" data-tab="daily" role="tab">Daily collection</button>
      <button class="tab" data-tab="monthly" role="tab">Monthly collection</button>
    </div>

    <section id="tab-defaulters">
      <div class="card no-print" style="margin-bottom:1rem"><div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4 items-end">
        <div><label class="label" for="d-class">Class</label><select class="input" id="d-class"></select></div>
        <div><label class="label" for="d-section">Section</label><select class="input" id="d-section"></select></div>
        <div><button class="btn btn-light" id="d-csv">Export CSV</button></div></div></div>
      <div class="card"><div class="muted small" id="d-summary" style="margin-bottom:.5rem"></div><div class="table-wrap"><table class="tbl">
        <thead><tr><th>Roll no</th><th>Student</th><th>Class</th><th>Phone</th><th class="num">Months overdue</th><th class="num">Amount due</th></tr></thead>
        <tbody id="d-rows"></tbody></table></div></div>
    </section>

    <section id="tab-daily" style="display:none">
      <div class="card no-print" style="margin-bottom:1rem"><div class="grid gap-3 sm:grid-cols-4"><div><label class="label" for="y-date">Date</label><input class="input" id="y-date" type="date"></div></div></div>
      <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4" id="y-totals" style="margin-bottom:1rem"></div>
      <div class="card"><div class="table-wrap"><table class="tbl">
        <thead><tr><th>Receipt</th><th>Student</th><th>Class</th><th>Challan</th><th>Method</th><th>Received by</th><th class="num">Amount</th></tr></thead>
        <tbody id="y-rows"></tbody></table></div></div>
    </section>

    <section id="tab-monthly" style="display:none">
      <div class="card no-print" style="margin-bottom:1rem"><div class="grid gap-3 sm:grid-cols-4"><div><label class="label" for="m-month">Month</label><input class="input" id="m-month" type="month"></div></div></div>
      <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4" id="m-totals" style="margin-bottom:1rem"></div>
      <div class="grid gap-3 lg:grid-cols-3">
        <div class="card"><h2 style="margin:0 0 .5rem;font-size:1rem">Collected by day</h2><div class="table-wrap"><table class="tbl"><thead><tr><th>Date</th><th class="num">Payments</th><th class="num">Amount</th></tr></thead><tbody id="m-days"></tbody></table></div></div>
        <div class="card"><h2 style="margin:0 0 .5rem;font-size:1rem">By method</h2><div class="table-wrap"><table class="tbl"><tbody id="m-methods"></tbody></table></div></div>
        <div class="card"><h2 style="margin:0 0 .5rem;font-size:1rem">By class</h2><div class="table-wrap"><table class="tbl"><tbody id="m-classes"></tbody></table></div></div>
      </div>
    </section>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/reports.js"></script>
</body>
</html>
