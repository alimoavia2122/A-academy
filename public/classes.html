<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classes & settings | Arhum Academy Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <div class="flex items-center gap-3"><button class="btn btn-light menu-btn" id="menu-btn" aria-label="Open menu">☰</button><h1>Classes & settings</h1></div>
      <div class="flex gap-2 flex-wrap no-print" id="head-actions"><button class="btn" id="btn-add">+ Add class</button></div>
    </div>
    <div class="card" style="margin-bottom:1.25rem">
      <div class="muted small" style="margin-bottom:.5rem">Changing a class fee only affects new admissions. Existing students keep their own fee.</div>
      <div class="table-wrap"><table class="tbl">
        <thead><tr><th>Class</th><th class="num">Monthly fee</th><th>Sections</th><th></th></tr></thead>
        <tbody id="rows"></tbody></table></div>
    </div>

    <div class="card" style="max-width:44rem">
      <h2 style="margin:0 0 .75rem;font-size:1.1rem">Academy settings</h2>
      <div class="form-error" id="set-error" role="alert"></div>
      <form id="settings-form" novalidate>
        <div class="grid gap-3 sm:grid-cols-2">
          <div class="sm:col-span-2"><label class="label" for="academy_name">Academy name</label><input class="input" id="academy_name" maxlength="100"></div>
          <div><label class="label" for="address">Address</label><input class="input" id="address" maxlength="200"></div>
          <div><label class="label" for="phone">Phone</label><input class="input" id="phone" maxlength="40"></div>
          <div><label class="label" for="due_day">Challan due day of month (1–28)</label><input class="input" id="due_day" type="number" min="1" max="28"></div>
          <div><label class="label" for="late_fine">Late fine after due date (Rs.)</label><input class="input" id="late_fine" type="number" min="0"></div>
          <div><label class="label" for="admission_fee_default">Default admission fee (Rs.)</label><input class="input" id="admission_fee_default" type="number" min="0"></div>
        </div>
        <button class="btn" type="submit" id="set-btn" style="margin-top:1rem">Save settings</button>
      </form>
    </div>

    <div class="modal-back" id="m-class"><div class="modal" style="max-width:26rem">
      <div class="flex justify-between items-center" style="margin-bottom:.75rem"><h2 id="m-title">Add class</h2>
        <button class="btn btn-light btn-sm" type="button" data-close aria-label="Close">✕</button></div>
      <div class="form-error" id="form-error" role="alert"></div>
      <form id="class-form" novalidate>
        <div style="margin-bottom:.75rem"><label class="label" for="c-name">Class name *</label><input class="input" id="c-name" maxlength="50" placeholder="e.g. Class 1"></div>
        <div style="margin-bottom:.75rem"><label class="label" for="c-fee">Monthly tuition fee (Rs.) *</label><input class="input" id="c-fee" type="number" min="0"></div>
        <div><label class="label" for="c-order">Display order</label><input class="input" id="c-order" type="number" value="0"></div>
        <div class="flex justify-end gap-2" style="margin-top:1rem"><button class="btn btn-light" type="button" data-close>Cancel</button>
          <button class="btn" type="submit" id="save-btn">Save class</button></div>
      </form>
    </div></div>

    <div class="modal-back" id="m-section"><div class="modal" style="max-width:22rem">
      <div class="flex justify-between items-center" style="margin-bottom:.75rem"><h2 id="s-title">Add section</h2>
        <button class="btn btn-light btn-sm" type="button" data-close aria-label="Close">✕</button></div>
      <div class="form-error" id="sec-error" role="alert"></div>
      <form id="section-form" novalidate>
        <label class="label" for="s-name">Section name *</label><input class="input" id="s-name" maxlength="20" placeholder="e.g. A">
        <div class="flex justify-end gap-2" style="margin-top:1rem"><button class="btn btn-light" type="button" data-close>Cancel</button>
          <button class="btn" type="submit" id="sec-btn">Add section</button></div>
      </form>
    </div></div>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/classes.js"></script>
</body>
</html>
