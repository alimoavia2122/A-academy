<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expenses | Arhum Academy Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="app">
  <aside id="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <div class="flex items-center gap-3"><button class="btn btn-light menu-btn" id="menu-btn" aria-label="Open menu">☰</button><h1>Expenses</h1></div>
      <div class="flex gap-2 flex-wrap no-print" id="head-actions"><button class="btn" id="btn-add">+ Add expense</button></div>
    </div>
    <div class="card" style="margin-bottom:1rem">
      <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
        <div><label class="label" for="f-month">Month</label><input class="input" id="f-month" type="month"></div>
        <div><label class="label" for="f-category">Category</label><select class="input" id="f-category"></select></div>
      </div>
    </div>
    <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4" id="totals" style="margin-bottom:1rem"></div>
    <div class="card"><div class="table-wrap"><table class="tbl">
      <thead><tr><th>Date</th><th>Category</th><th>Description</th><th class="num">Amount</th><th></th></tr></thead>
      <tbody id="rows"></tbody></table></div></div>

    <div class="modal-back" id="m-exp"><div class="modal" style="max-width:28rem">
      <div class="flex justify-between items-center" style="margin-bottom:.75rem"><h2 id="m-title">Add expense</h2>
        <button class="btn btn-light btn-sm" type="button" data-close aria-label="Close">✕</button></div>
      <div class="form-error" id="form-error" role="alert"></div>
      <form id="exp-form" novalidate>
        <div class="grid gap-3 sm:grid-cols-2">
          <div><label class="label" for="expense_date">Date *</label><input class="input" id="expense_date" type="date"></div>
          <div><label class="label" for="category">Category *</label><select class="input" id="category"></select></div>
          <div class="sm:col-span-2"><label class="label" for="amount">Amount (Rs.) *</label><input class="input" id="amount" type="number" min="1" step="1"></div>
          <div class="sm:col-span-2"><label class="label" for="description">Description</label><input class="input" id="description" maxlength="250"></div>
        </div>
        <div class="flex justify-end gap-2" style="margin-top:1rem"><button class="btn btn-light" type="button" data-close>Cancel</button>
          <button class="btn" type="submit" id="save-btn">Save expense</button></div>
      </form>
    </div></div>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/expenses.js"></script>
</body>
</html>
